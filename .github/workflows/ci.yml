name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: poc-web

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies and quality tools
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 pylint bandit pip-audit radon
          mkdir -p ../reports

      - name: Security scan (bandit)
        run: bandit -r . -ll -s B104 -x ./tests -f txt -o ../reports/bandit.txt || true

      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt > ../reports/pip-audit.txt 2>&1 || true

      - name: Style and bugs (flake8)
        run: flake8 . --max-line-length=120 --count --statistics > ../reports/flake8.txt || true

      - name: Code analysis (pylint)
        run: pylint $(git ls-files '*.py') > ../reports/pylint.txt || true

      - name: Complexity (radon)
        run: |
          radon cc . -s -a -nB > ../reports/radon-complexity.txt
          radon mi . -s > ../reports/radon-maintainability.txt

      - name: Test coverage (pytest-cov)
        run: pytest --cov=. --cov-report=term --cov-report=xml:../reports/coverage.xml -q > ../reports/coverage.txt || true

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: |
            APP_VERSION=gha-${{ github.run_number }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:gha-${{ github.run_number }}

  update-config:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: update-config
    steps:
      - name: Check out the config repo
        uses: actions/checkout@v4
        with:
          repository: HARSHITHA194/poc-k8s-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          ref: main

      - name: Set the new image tag
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:gha-${{ github.run_number }}
        run: |
          sed -i -E "s|image: docker.io/.*/poc-web:.*|image: ${IMAGE}|" deployment.yaml
          grep "image:" deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git diff --cached --quiet && echo "No change to commit" && exit 0
          git commit -m "Deploy poc-web:gha-${{ github.run_number }}"
          git pull --rebase origin main
          git push origin main